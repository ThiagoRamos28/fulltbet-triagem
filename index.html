<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Painel — fulltbet</title>
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0d10" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1e7cd" />
    <script>
      // Lê a escolha manual de tema (se houver) antes do primeiro paint, pra não piscar o tema
      // errado enquanto o React sobe. Sem escolha salva, o CSS segue prefers-color-scheme normal.
      (function () {
        try {
          var t = localStorage.getItem('tema')
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        } catch (e) {}
      })()
    </script>

    />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Petrona:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

  </body>
</html>
