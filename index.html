<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Painel — fulltbet</title>
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080b10" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f1ea" />
    <script>
      // Lê a escolha manual de tema (se houver) antes do primeiro paint, pra não piscar o tema
      // errado enquanto o React sobe. Sem escolha salva, o CSS segue prefers-color-scheme normal.
      (function () {
        try {
          var t = localStorage.getItem('tema')
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        } catch (e) {}
      })()
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23080b10'/%3E%3Ccircle cx='16' cy='16' r='9.5' fill='none' stroke='%2300e0a4' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='1.6' fill='%2300e0a4'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
